name: evalspark-rag-test

# 独立测试项目：不读取业务 env_file、不复用业务网络或数据卷。
x-backend-test: &backend_test
  image: evalspark-rag-backend:test
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  volumes:
    - ./backend:/workspace/backend:ro
    - ./frontend:/workspace/frontend:ro
    - ./scripts:/workspace/scripts:ro
    - ./.env.example:/workspace/.env.example:ro
    - ./docker-compose.yml:/workspace/docker-compose.yml:ro
    - ./docker-compose.rag-test.yml:/workspace/docker-compose.rag-test.yml:ro
    - ./docker:/workspace/docker:ro
  working_dir: /workspace/backend
  mem_limit: 1g

services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rag-test-root-only
      MYSQL_DATABASE: multichateval_rag_test
      MYSQL_USER: multichateval
      MYSQL_PASSWORD: rag-test-only
    volumes:
      - rag_test_mysql:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  runner:
    <<: *backend_test
    environment:
      DATABASE_URL: mysql+aiomysql://multichateval:rag-test-only@mysql-test:3306/multichateval_rag_test
      RAG_INTEGRATION_TESTS: "1"
      APP_ENV: test
      JWT_SECRET_KEY: rag-test-only-key-with-at-least-32-characters
      RAG_DOCUMENTS_DIR: /tmp/rag-documents
    depends_on:
      mysql-test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests/test_knowledge_base_service.py", "tests/test_knowledge_base_api.py", "tests/test_rag_migrations.py", "tests/test_rag_jobs.py", "tests/test_rag_indexing.py", "tests/test_rag_chunk_storage.py", "tests/test_rag_worker.py", "tests/test_rag_usage_mysql.py", "-q"]
    mem_limit: 1g

  unit-runner:
    <<: *backend_test
    profiles: [unit]
    network_mode: none
    environment:
      DATABASE_URL: mysql+aiomysql://test:test@invalid:3306/unit_test
      APP_ENV: test
      JWT_SECRET_KEY: rag-test-only-key-with-at-least-32-characters
      RAG_INTEGRATION_TESTS: "0"
      RAG_LIFECYCLE_TESTS: "0"
      RAG_ACCEPTANCE_TESTS: "0"
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "-q"]

  frontend-test:
    profiles: [unit]
    image: evalspark-rag-frontend:test
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    network_mode: none
    # 使用新镜像内的源代码和依赖，不挂载业务 node_modules 或输出 dist 到宿主机。
    command: ["pnpm", "test"]
    mem_limit: 2g

  qdrant-test:
    profiles: [lifecycle]
    image: qdrant/qdrant:v1.19.0@sha256:6c0652f8d6925b22f2f6f0e0a5365a6c9dbc8768bd6e70ccc1cdc14847e452a0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - rag_test_vectors:/qdrant/storage
    mem_limit: 512m

  redis-test:
    profiles: [lifecycle]
    image: redis:7.2.16-bookworm@sha256:e17e3a1993da428251cbd88dbdb3de8c8d4007f840d7350eb17a2d8695fa705f
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - rag_test_redis:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding-test:
    profiles: [lifecycle]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:c26a226262ad4ff3330fb30b76653c1bb65da2fcf413b92284545a010e0a8a48
    platform: linux/amd64
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--revision", "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3", "--huggingface-hub-cache", "/data", "--port", "80", "--hostname", "0.0.0.0", "--dtype", "float32", "--tokenization-workers", "2", "--max-client-batch-size", "16", "--max-batch-tokens", "2048", "--max-batch-requests", "16", "--auto-truncate", "true", "--max-concurrent-requests", "8", "--disable-spans"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
    volumes:
      - rag_cached_model:/data
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 5m

  worker-test:
    profiles: [lifecycle]
    image: evalspark-rag-backend:test
    environment: &lifecycle_environment
      DATABASE_URL: mysql+aiomysql://multichateval:rag-test-only@mysql-test:3306/multichateval_rag_test
      APP_ENV: test
      JWT_SECRET_KEY: rag-test-only-key-with-at-least-32-characters
      RAG_DOCUMENTS_DIR: /test-documents
      RAG_EMBEDDING_URL: http://embedding-test:80
      RAG_QDRANT_URL: http://qdrant-test:6333
      RAG_REDIS_URL: redis://redis-test:6379/0
    volumes:
      - ./backend:/app:ro
      - rag_cached_model:/data:ro
      - rag_test_documents:/test-documents
    command: ["python", "-m", "celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "--queues=rag"]
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_started
    mem_limit: 1g

  lifecycle-runner:
    profiles: [lifecycle]
    extends:
      service: runner
    environment:
      <<: *lifecycle_environment
      RAG_INTEGRATION_TESTS: "1"
      RAG_LIFECYCLE_TESTS: "1"
    volumes:
      - rag_cached_model:/data:ro
      - rag_test_documents:/test-documents
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests/test_rag_lifecycle.py", "-q"]

  model-test:
    profiles: [lifecycle]
    image: evalspark-rag-backend:test
    volumes:
      - ./backend/tests/integration:/test-model:ro
    command: ["python", "-m", "uvicorn", "fake_models:app", "--app-dir", "/test-model", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  acceptance-runner:
    profiles: [lifecycle]
    extends:
      service: lifecycle-runner
    environment:
      RAG_ACCEPTANCE_TESTS: "1"
      RAG_TOKENIZER_TESTS: "1"
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "tests/test_rag_documents.py", "tests/test_rag_lifecycle.py", "tests/test_rag_usage.py", "tests/integration/test_rag_docker.py", "-q"]

volumes:
  rag_test_mysql:
  rag_test_vectors:
  rag_test_redis:
  rag_test_documents:
  # 仅复用固定模型缓存；测试正文、队列、向量和 MySQL 均为当前测试项目独立卷。
  rag_cached_model:
    external: true
    name: evalspark_rag_model_cache
