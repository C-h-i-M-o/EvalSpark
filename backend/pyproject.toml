[project]
name = "multichateval-backend"
version = "0.1.0"
description = "MultiChatEval FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "alembic>=1.13.0",
  "celery[redis]==5.6.3",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "huggingface-hub==1.29.0",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.10.0",
  "pypdf==6.16.2",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "qdrant-client==1.19.0",
  "redis==6.4.0",
  "semantic-text-splitter==0.32.0",
  "sqlalchemy>=2.0.0",
  "tokenizers==0.23.1",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
